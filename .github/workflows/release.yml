name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Windows packaging tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends curl unzip zip
      - run: npm ci
      - run: npm test
      - name: Apply tagged version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          npm version "$version" --no-git-tag-version --ignore-scripts --allow-same-version
      - name: Build Windows agent package
        run: bash scripts/package-windows-agent.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare container metadata
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo 'tags<<EOF' >> "$GITHUB_OUTPUT"
          echo "ghcr.io/${REPOSITORY,,}:${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "ghcr.io/${REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"
      - name: Build and publish container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/wake-agent-windows-x64.zip
