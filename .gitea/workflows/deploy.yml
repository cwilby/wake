name: Deploy Wake and package Windows agent

on:
  push:
    branches: [master]
  workflow_dispatch:

# Serialize releases so two builds cannot allocate the same version.
concurrency:
  group: wake-release
  cancel-in-progress: false

jobs:
  build:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    container: node:24-bookworm
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl unzip zip
      - name: Test
        run: |
          npm ci
          npm test
      - name: Bump release version
        id: version
        run: npm run build
      - name: Publish version tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! git rev-parse --verify "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            git tag "v$RELEASE_VERSION"
          fi
          git push origin "refs/tags/v$RELEASE_VERSION"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    container: node:24-bookworm
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply build version
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts --allow-same-version
      - name: Install deployment tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends rsync openssh-client zip
          npm install
      - name: Build portable Windows agent  
        run: bash scripts/package-windows-agent.sh
      - uses: https://github.com/actions/upload-artifact@v3
        with:
          name: wake-agent-windows-x64
          path: dist/wake-agent-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Sync application and restart containers
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          AGENT_WINDOWS_DEPLOY_HOST: ${{ secrets.AGENT_WINDOWS_DEPLOY_HOST }}
          AGENT_WINDOWS_DEPLOY_USERNAME: ${{ secrets.AGENT_WINDOWS_DEPLOY_USERNAME }}
          AGENT_WINDOWS_DEPLOY_SSH_KEY: ${{ secrets.AGENT_WINDOWS_DEPLOY_SSH_KEY }}
          AGENT_WINDOWS_DEPLOY_SSH_PORT: ${{ secrets.AGENT_WINDOWS_DEPLOY_SSH_PORT }}
          AGENT_WINDOWS_DEPLOY_KNOWN_HOSTS: ${{ secrets.AGENT_WINDOWS_DEPLOY_KNOWN_HOSTS }}
        run: bash scripts/deploy.sh
